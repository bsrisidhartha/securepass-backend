# Spring Boot Application Properties
spring.application.name=securepass-backend
server.port=${PORT:8080}

# Datasource configuration: defaults to in-memory H2 for local dev, 
# or connects to Aiven MySQL if DB_URL (or SPRING_DATASOURCE_URL) is provided.
spring.datasource.url=${DB_URL:jdbc:h2:mem:securepassdb}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# In-memory H2 Console (available during local development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
